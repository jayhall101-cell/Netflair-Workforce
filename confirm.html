<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>NETFLAIR — Outage Confirmation</title>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#0d2440; color:#eef4fc; display:flex; align-items:center; justify-content:center;
         min-height:100vh; text-align:center; }
  .card { background:#12325c; border-radius:14px; padding:36px 28px; max-width:420px; width:90%;
          box-shadow:0 10px 40px rgba(0,0,0,.45); }
  .logo { font-weight:800; letter-spacing:2px; font-size:20px; color:#fff; margin-bottom:6px; }
  .sub  { color:#9fb6d4; font-size:12px; margin-bottom:26px; }
  h1 { font-size:20px; margin:0 0 10px; }
  p  { color:#c9d8ec; font-size:14px; line-height:1.5; margin:0 0 6px; }
  .ok   h1 { color:#5ee08a; }
  .bad  h1 { color:#ff8f87; }
  .wait h1 { color:#ffd479; }
  .spin { margin:18px auto 0; width:28px; height:28px; border:3px solid #2c5a99;
          border-top-color:#5ea2ff; border-radius:50%; animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">NETFLAIR</div>
  <div class="sub">Live Outage Confirmation</div>
  <div id="content" class="wait">
    <h1>Confirming…</h1>
    <p>Checking your confirmation link.</p>
    <div class="spin"></div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://eiwilltaxbavvskaugdv.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpd2lsbHRheGJhdnZza2F1Z2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTU0MDcsImV4cCI6MjA5MTM3MTQwN30.b-SQ6v9n4nyrj7aInoTUHUcKSTIPC59SRrAC0aV-j60';

(async () => {
  const el = document.getElementById('content');
  const token = new URLSearchParams(location.search).get('t');
  if (!token) { el.className='bad'; el.innerHTML='<h1>Invalid link</h1><p>No confirmation token found.</p>'; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/confirm_outage`, {
      method: 'POST',
      headers: { 'apikey': ANON, 'Authorization': `Bearer ${ANON}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    });
    const d = await r.json();
    const tower = d.tower ? ` — <b>${d.tower}</b>` : '';
    if (d.result === 'confirmed') {
      el.className='ok';
      el.innerHTML = `<h1>✓ LIVE OUTAGE confirmed${tower}</h1>
        <p>The agent is creating the LIVE OUTAGE ticket and the dispatch job now.</p>
        <p>${d.affected != null ? d.affected + ' customers affected.' : ''}</p>
        <p>You can close this page.</p>`;
    } else if (d.result === 'already') {
      el.className='ok';
      el.innerHTML = `<h1>Already confirmed${tower}</h1><p>The ticket and job were already requested. Nothing more to do.</p>`;
    } else if (d.result === 'expired') {
      el.className='bad';
      el.innerHTML = `<h1>Link expired${tower}</h1><p>This confirmation has expired — the tower may already be back online. Check UISP or contact Yahmar.</p>`;
    } else {
      el.className='bad';
      el.innerHTML = '<h1>Invalid link</h1><p>This confirmation link is not recognised.</p>';
    }
  } catch (e) {
    el.className='bad';
    el.innerHTML = '<h1>Connection problem</h1><p>Could not reach the server. Try again in a moment.</p>';
  }
})();
</script>
</body>
</html>
